<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共有ボード</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8;--bg2:#ede8df;--bg3:#e5dfd5;
  --surface:#faf7f2;--surface2:#f0ebe1;
  --border:#d8d0c0;--border2:#c8bfad;
  --text:#3a3228;--text2:#6b5f50;--text3:#9b8e7d;
  --accent:#8b6f47;--accent2:#a07850;
  --accent-light:#f0e6d6;--accent-lighter:#f7f0e5;
  --red:#c0392b;--green:#27ae60;--blue:#2980b9;
  --purple:#8e44ad;--black:#2c3e50;--yellow:#f39c12;
  --red-light:#fdecea;--green-light:#eafaf1;--blue-light:#eaf4fb;
  --purple-light:#f5eef8;--black-light:#eaecee;--yellow-light:#fef9e7;
  --shadow:0 2px 12px rgba(100,80,50,0.10);
  --shadow2:0 4px 24px rgba(100,80,50,0.15);
  --radius:16px;--radius2:12px;--radius3:8px;
  --tab-h:64px;--header-h:56px;--app-width:412px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg3);min-height:100vh;font-family:'Zen Maru Gothic',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
#app{width:var(--app-width);max-width:100vw;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;}
/* HEADER */
.header{height:var(--header-h);background:var(--surface);border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(100,80,50,0.07);}
.header-logo{font-family:'Quicksand',sans-serif;font-weight:700;font-size:20px;color:var(--accent);letter-spacing:2px;}

/* TABS */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:var(--surface);border-top:1.5px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:200;box-shadow:0 -2px 12px rgba(100,80,50,0.08);max-width:var(--app-width);margin:0 auto;}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px 8px;position:relative;-webkit-tap-highlight-color:transparent;}
.tab-item:active{background:var(--bg2);}
.tab-item.active{background:var(--accent-lighter);}
.tab-item.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 4px 4px;}
.tab-icon{font-size:20px;line-height:1;}
.tab-label{font-size:9px;font-weight:600;color:var(--text3);}
.tab-item.active .tab-label{color:var(--accent);}
/* CONTENT */
.content{flex:1;overflow-y:auto;padding-bottom:calc(var(--tab-h)+80px);}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
/* CALENDAR */
.cal-wrap{background:var(--surface);border-bottom:2px solid var(--border);}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px;}
.cal-title{font-size:16px;font-weight:700;color:var(--text);}
.cal-nav{background:none;border:none;font-size:20px;color:var(--accent);cursor:pointer;padding:4px 10px;border-radius:8px;-webkit-tap-highlight-color:transparent;}
.cal-nav:active{background:var(--bg2);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;}
.cal-dow-cell{text-align:center;font-size:9px;font-weight:700;color:var(--text3);padding:2px 0;}
.cal-dow-cell:first-child{color:var(--blue);}
.cal-dow-cell:last-child{color:var(--red);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px 6px;gap:1px;}
.cal-cell{min-height:42px;border-radius:6px;padding:2px 2px 2px;cursor:pointer;position:relative;border:1px solid transparent;-webkit-tap-highlight-color:transparent;transition:background 0.12s;}
.cal-cell:active{background:var(--bg2);}
.cal-cell.other-month{opacity:0.35;}
.cal-cell.today .cal-date{background:var(--accent);color:#fff;border-radius:50%;}
.cal-cell.selected{border-color:var(--accent);background:var(--accent-lighter);}
.cal-date{font-size:10px;font-weight:600;color:var(--text);width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 1px;}
.cal-cell.dow-0 .cal-date{color:var(--blue);}
.cal-cell.dow-6 .cal-date{color:var(--red);}
.cal-events{display:flex;flex-direction:column;gap:1px;}
.cal-event-dot{font-size:8px;font-weight:700;line-height:1.2;padding:1px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff !important;}
/* DAY PANEL */
.day-panel{background:var(--surface);border-bottom:2px solid var(--border);padding:10px 14px;display:none;}
.day-panel.open{display:block;}
.day-panel-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;}
.day-event-item{padding:8px 12px;border-radius:var(--radius3);margin-bottom:6px;cursor:pointer;border-left:4px solid transparent;background:var(--bg);border:1px solid var(--border);-webkit-tap-highlight-color:transparent;}
.day-event-item:active{opacity:0.8;}
.day-event-title{font-size:13px;font-weight:700;}
.day-event-memo{font-size:11px;color:var(--text3);margin-top:2px;}
.day-add-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:none;border:1.5px dashed var(--border2);border-radius:var(--radius3);font-size:12px;color:var(--accent);font-weight:700;cursor:pointer;width:100%;font-family:'Zen Maru Gothic',sans-serif;-webkit-tap-highlight-color:transparent;margin-top:4px;}
/* MEMO SECTION */
.memo-section{padding:12px 14px 8px;}
.memo-section-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;}
.memo-item{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius3);margin-bottom:5px;overflow:hidden;border-left-width:4px;}
.memo-check-area{width:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.memo-check{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
.memo-content{flex:1;padding:7px 6px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent;}
.memo-content-text{font-size:13px;color:var(--text);word-break:break-all;line-height:1.5;}
.memo-move-area{width:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg2);gap:0;}
.memo-move-btn{background:none;border:none;font-size:16px;color:var(--text3);cursor:pointer;padding:4px 0;width:100%;text-align:center;-webkit-tap-highlight-color:transparent;line-height:1;}
.memo-move-btn:active{background:var(--border2);color:var(--accent);}
/* FAB */
.fab{position:fixed;right:16px;bottom:calc(var(--tab-h)+16px);width:52px;height:52px;background:var(--accent);border:none;border-radius:50%;font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(139,111,71,0.4);z-index:150;-webkit-tap-highlight-color:transparent;}
.fab:active{transform:scale(0.92);}
/* FLOAT BAR */
.float-bar{position:fixed;bottom:calc(var(--tab-h)+12px);left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:300;padding:0 12px;}
.float-btn{padding:9px 20px;border:none;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;box-shadow:var(--shadow2);-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.float-btn-primary{background:var(--accent);color:#fff;}
.float-btn-green{background:var(--green);color:#fff;}
.float-btn-red{background:var(--red);color:#fff;}
.float-btn-cancel{background:var(--surface);color:var(--text2);border:1.5px solid var(--border);}
/* DONE ACCORDION */
.done-section{margin:8px 14px 20px;}
.done-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-radius:var(--radius2);border:1.5px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.done-header-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text3);}
.done-chevron{font-size:12px;color:var(--text3);transition:transform 0.2s;}
.done-section.open .done-chevron{transform:rotate(90deg);}
.done-body{display:none;padding:6px 0 0;}
.done-section.open .done-body{display:block;}
.done-item{display:flex;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius3);margin-bottom:5px;opacity:0.6;border-left-width:4px;}
.done-item-text{flex:1;font-size:13px;color:var(--text3);text-decoration:line-through;word-break:break-all;}
.done-delete-all{padding:5px 12px;border:1.5px solid var(--red);border-radius:16px;background:none;font-size:11px;font-weight:700;color:var(--red);cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;-webkit-tap-highlight-color:transparent;}
/* COLOR PICKER */
.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
.color-dot.selected{border-color:var(--text);transform:scale(1.2);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(50,40,30,0.45);z-index:500;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity 0.22s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{width:var(--app-width);max-width:100vw;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:0;transform:translateY(100%);transition:transform 0.26s cubic-bezier(0.32,0.72,0,1);max-height:88vh;display:flex;flex-direction:column;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 4px;flex-shrink:0;}
.modal-title{font-size:16px;font-weight:700;color:var(--text);padding:8px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-close{background:none;border:none;font-size:22px;color:var(--text3);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.modal-body{padding:18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
.modal-footer{padding:12px 18px 24px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius3);font-size:14px;color:var(--text);background:var(--bg);font-family:'Zen Maru Gothic',sans-serif;outline:none;}
.form-input:focus{border-color:var(--accent);}
.form-textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius3);font-size:13px;color:var(--text);background:var(--bg);font-family:'Zen Maru Gothic',sans-serif;outline:none;resize:none;min-height:80px;line-height:1.6;}
.form-textarea:focus{border-color:var(--accent);}
.btn-primary{width:100%;padding:13px;background:var(--accent);border:none;border-radius:var(--radius2);font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;-webkit-tap-highlight-color:transparent;}
.btn-primary:active{background:var(--accent2);}
.btn-cancel{width:100%;padding:11px;background:none;border:1.5px solid var(--border);border-radius:var(--radius2);font-size:14px;color:var(--text2);cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;-webkit-tap-highlight-color:transparent;}
.btn-danger{width:100%;padding:11px;background:none;border:1.5px solid var(--red);border-radius:var(--radius2);font-size:14px;font-weight:600;color:var(--red);cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;-webkit-tap-highlight-color:transparent;}
/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(50,40,30,0.5);z-index:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.confirm-overlay.open{opacity:1;pointer-events:all;}
.confirm-box{width:280px;background:var(--surface);border-radius:var(--radius);padding:24px 20px 18px;text-align:center;box-shadow:var(--shadow2);}
.confirm-title{font-size:15px;font-weight:700;margin-bottom:8px;}
.confirm-btns{display:flex;gap:10px;margin-top:16px;}
.confirm-btn{flex:1;padding:10px;border-radius:var(--radius3);font-size:14px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;border:none;}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--tab-h)+80px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;z-index:999;white-space:nowrap;max-width:90%;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text3);font-size:14px;gap:10px;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<!-- Event Modal -->

        <div class="color-picker" id="eventColorPicker"></div>
      </div>
    </div>

<!-- Memo Modal -->

  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title"><span id="memoModalTitle">メモを追加</span><button class="modal-close" onclick="closeMemoModal()">✕</button></div>

      <div class="form-group"><label class="form-label">テキスト</label><textarea class="form-textarea" id="memoContent" placeholder="メモを入力" style="min-height:120px;"></textarea></div>
      <div class="form-group"><label class="form-label">色</label>
        <div class="color-picker" id="memoColorPicker"></div>
      </div>

    <div class="modal-footer">
      <button class="btn-primary" id="memoSaveBtn" onclick="saveMemo()">追加</button>
      <button class="btn-cancel" onclick="closeMemoModal()">キャンセル</button>
    </div>
  </div>
</div>

<!-- Confirm -->

  </div>
</div>

<script>

var COLORS={red:'#c0392b',green:'#27ae60',blue:'#2980b9',purple:'#8e44ad',black:'#2c3e50',yellow:'#f39c12'};
var COLOR_LABELS={red:'赤',green:'緑',blue:'青',purple:'紫',black:'黒',yellow:'黄'};
var COLOR_LIGHT={red:'#fdecea',green:'#eafaf1',blue:'#eaf4fb',purple:'#f5eef8',black:'#eaecee',yellow:'#fef9e7'};

function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ===== INIT =====
async function init(){
  try{
    var er=await sb.from('calendar_events').select('*').order('sort_order');
    events=er.data||[];
    var mr=await sb.from('board_memos').select('*').order('sort_order');
    memos=mr.data||[];
    render();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="loading-wrap">読み込みエラー: '+e.message+'</div>';
  }
}

// ===== DATE HELPERS =====
function dateStr(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function todayStr(){var d=new Date();return dateStr(d.getFullYear(),d.getMonth(),d.getDate());}

// ===== RENDER =====
function render(){
  var html='';
  html+=renderCalendar();
  html+=renderDayPanel();
  html+=renderMemos();
  document.getElementById('content').innerHTML=html;
  addFab();
}

function renderCalendar(){
  var MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var DOWS=['月','火','水','木','金','土','日'];
  var today=todayStr();
  var firstDay=new Date(curYear,curMonth,1);
  var lastDay=new Date(curYear,curMonth+1,0);
  // Monday=0 offset
  var startDow=(firstDay.getDay()+6)%7; // Mon=0
  var html='<div class="cal-wrap">';
  html+='<div class="cal-header">'
    +'<button class="cal-nav" onclick="prevMonth()">‹</button>'
    +'<div class="cal-title">'+curYear+'年 '+MONTHS[curMonth]+'</div>'
    +'<button class="cal-nav" onclick="nextMonth()">›</button>'
    +'</div>';
  html+='<div class="cal-dow">';
  DOWS.forEach(function(d){html+='<div class="cal-dow-cell">'+d+'</div>';});
  html+='</div><div class="cal-grid">';
  // prev month cells
  var prevLast=new Date(curYear,curMonth,0).getDate();
  for(var i=0;i<startDow;i++){
    var d2=prevLast-startDow+1+i;
    var pm=curMonth-1<0?11:curMonth-1;
    var py=curMonth-1<0?curYear-1:curYear;
    html+=renderCell(py,pm,d2,true);
  }
  // this month
  for(var d=1;d<=lastDay.getDate();d++){
    html+=renderCell(curYear,curMonth,d,false);
  }
  // next month
  var total=startDow+lastDay.getDate();
  var nextCells=(7-total%7)%7;
  for(var n=1;n<=nextCells;n++){
    var nm=curMonth+1>11?0:curMonth+1;
    var ny=curMonth+1>11?curYear+1:curYear;
    html+=renderCell(ny,nm,n,true);
  }
  html+='</div></div>';
  return html;
}

function renderCell(y,m,d,otherMonth){
  var ds=dateStr(y,m,d);
  var dow=(new Date(y,m,d).getDay()+6)%7; // Mon=0
  var isToday=ds===todayStr();
  var isSel=ds===selectedDate;
  var cls='cal-cell'+(otherMonth?' other-month':'')+(isToday?' today':'')+(isSel?' selected':'');
  cls+=' dow-'+dow;
  var dayEvts=events.filter(function(e){return e.date===ds;});
  var html='<div class="'+cls+'" onclick="selectDate(\''+ds+'\')"><div class="cal-date">'+d+'</div><div class="cal-events">';
  dayEvts.slice(0,3).forEach(function(e){
    var col=COLORS[e.color]||COLORS.red;
    html+='<div class="cal-event-dot" style="background:'+col+';">'+esc(e.title)+'</div>';
  });
  if(dayEvts.length>3) html+='<div style="font-size:8px;color:var(--text3);text-align:center;">+'+(dayEvts.length-3)+'</div>';
  html+='</div></div>';
  return html;
}

function renderDayPanel(){
  if(!selectedDate) return '';
  var dayEvts=events.filter(function(e){return e.date===selectedDate;}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
  var d=new Date(selectedDate.replace(/-/g,'/'));
  var label=(d.getMonth()+1)+'月'+d.getDate()+'日 の予定';
  var html='<div class="day-panel open">';
  html+='<div class="day-panel-title">'+esc(label)+'</div>';
  dayEvts.forEach(function(e){
    var col=COLORS[e.color]||COLORS.red;
    var bg=COLOR_LIGHT[e.color]||COLOR_LIGHT.red;
    html+='<div class="day-event-item" style="border-left-color:'+col+';background:'+bg+';" onclick="openEditEvent(\''+e.id+'\')">'
      +'<div class="day-event-title" style="color:'+col+';">'+esc(e.title)+'</div>'
      +(e.memo?'<div class="day-event-memo">'+esc(e.memo)+'</div>':'')
      +'</div>';
  });
  html+='<button class="day-add-btn" onclick="openAddEvent()">＋ 予定を追加</button>';
  html+='</div>';
  return html;
}

function renderMemos(){
  var activeMemos=memos.filter(function(m){return !m.is_done;}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
  var doneMemos=memos.filter(function(m){return m.is_done;}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
  var html='<div class="memo-section">';
  html+='<div class="memo-section-title">📝 共有メモ</div>';
  if(activeMemos.length===0){
    html+='<div style="text-align:center;color:var(--text3);font-size:13px;padding:20px 0;">メモがありません<br>右下の＋から追加できます</div>';
  }
  activeMemos.forEach(function(m,idx){
    var col=COLORS[m.color]||COLORS.red;
    var isChk=!!checkedMemos[m.id];
    html+='<div class="memo-item" style="border-left-color:'+col+';">'
      +'<div class="memo-check-area" onclick="toggleMemoCheck(\''+m.id+'\')">'
      +'<input type="checkbox" class="memo-check" '+(isChk?'checked':'')+' onclick="toggleMemoCheck(\''+m.id+'\');event.stopPropagation()">'
      +'</div>'
      +'<div class="memo-content" onclick="openEditMemo(\''+m.id+'\')">'
      +'<div class="memo-content-text" style="color:'+col+';">'+esc(m.content)+'</div>'
      +'</div>'
      +'<div class="memo-move-area">'
      +(idx>0?'<button class="memo-move-btn" onclick="moveMemo(\''+m.id+'\',-1)">▲</button>':'<div style="height:24px;"></div>')
      +(idx<activeMemos.length-1?'<button class="memo-move-btn" onclick="moveMemo(\''+m.id+'\',1)">▼</button>':'<div style="height:24px;"></div>')
      +'</div>'
      +'</div>';
  });
  html+='</div>';
  // Done section
  html+='<div class="done-section'+(doneSectionOpen?' open':'')+'" id="doneSection">';
  html+='<div class="done-header" onclick="toggleDoneSection()">'
    +'<div class="done-header-left"><span class="done-chevron">▶</span><span>完了済みメモ（'+doneMemos.length+'件）</span></div>'
    +(doneMemos.length>0?'<button class="done-delete-all" onclick="event.stopPropagation();deleteAllDone()">全削除</button>':'')
    +'</div>';
  html+='<div class="done-body">';
  doneMemos.forEach(function(m){
    var col=COLORS[m.color]||COLORS.red;
    html+='<div class="done-item" style="border-left-color:'+col+';">'
      +'<div class="done-item-text">'+esc(m.content)+'</div>'
      +'</div>';
  });
  html+='</div></div>';
  return html;
}

function addFab(){
  removeFabs();
  var hasChecked=Object.keys(checkedMemos).some(function(id){return checkedMemos[id];});
  if(hasChecked){
    var bar=document.createElement('div');bar.className='float-bar';
    bar.innerHTML='<button class="float-btn float-btn-cancel" onclick="clearMemoChecks()">キャンセル</button>'
      +'<button class="float-btn float-btn-red" onclick="deleteCheckedMemos()">削除</button>'
      +'<button class="float-btn float-btn-green" onclick="doneCheckedMemos()">完了</button>';
    document.getElementById('fabContainer').appendChild(bar);
  } else {
    var fab=document.createElement('button');fab.className='fab';fab.textContent='＋';
    fab.onclick=function(){openAddMemo();};
    document.getElementById('fabContainer').appendChild(fab);
  }
}

// ===== CALENDAR ACTIONS =====
function prevMonth(){curMonth--;if(curMonth<0){curMonth=11;curYear--;}selectedDate=null;render();}
function nextMonth(){curMonth++;if(curMonth>11){curMonth=0;curYear++;}selectedDate=null;render();}

function selectDate(ds){
  selectedDate=(selectedDate===ds)?null:ds;
  render();
}

// ===== EVENT MODAL =====
function buildColorPicker(pickerId, selected, onChange){
  var el=document.getElementById(pickerId);
  if(!el) return;
  var html='';
  Object.keys(COLORS).forEach(function(key){
    html+='<div class="color-dot'+(selected===key?' selected':'')+'" '
      +'style="background:'+COLORS[key]+';" '
      +'onclick="'+onChange+'(\''+key+'\')"></div>';
  });
  el.innerHTML=html;
}

function selectEventColor(c){eventColor=c;buildColorPicker('eventColorPicker',c,'selectEventColor');}
function selectMemoColor(c){memoColor=c;buildColorPicker('memoColorPicker',c,'selectMemoColor');}

function openAddEvent(){
  eventModalMode='add';eventEditId=null;eventColor='red';
  document.getElementById('eventModalTitle').textContent='予定を追加 ('+(selectedDate||'')+'）';
  document.getElementById('eventTitle').value='';
  document.getElementById('eventMemo').value='';
  document.getElementById('eventSaveBtn').textContent='追加';
  document.getElementById('eventDeleteBtn').style.display='none';
  buildColorPicker('eventColorPicker','red','selectEventColor');
  openModal('eventModal');
}

function openEditEvent(id){
  var ev=events.find(function(e){return e.id===id;});
  if(!ev) return;
  eventModalMode='edit';eventEditId=id;eventColor=ev.color||'red';
  document.getElementById('eventModalTitle').textContent='予定を編集';
  document.getElementById('eventTitle').value=ev.title||'';
  document.getElementById('eventMemo').value=ev.memo||'';
  document.getElementById('eventSaveBtn').textContent='完了';
  document.getElementById('eventDeleteBtn').style.display='block';
  buildColorPicker('eventColorPicker',eventColor,'selectEventColor');
  openModal('eventModal');
}

function closeEventModal(){closeModal('eventModal');}

async function saveEvent(){
  var title=document.getElementById('eventTitle').value.trim();
  if(!title){showToast('タイトルを入力してください');return;}
  var memo=document.getElementById('eventMemo').value.trim();
  try{
    if(eventModalMode==='add'){
      var maxO=0;events.filter(function(e){return e.date===selectedDate;}).forEach(function(e){if((e.sort_order||0)>maxO)maxO=e.sort_order||0;});
      var r=await sb.from('calendar_events').insert({date:selectedDate,title:title,memo:memo,color:eventColor,sort_order:maxO+1}).select().single();
      if(r.error)throw r.error;
      events.push(r.data);
    } else {
      var r2=await sb.from('calendar_events').update({title:title,memo:memo,color:eventColor}).eq('id',eventEditId);
      if(r2.error)throw r2.error;
      var idx=events.findIndex(function(e){return e.id===eventEditId;});
      if(idx>=0) Object.assign(events[idx],{title:title,memo:memo,color:eventColor});
    }
    closeEventModal();showToast('保存しました');render();
  }catch(e){showToast('保存失敗: '+e.message);}
}

async function deleteEvent(){
  try{
    await sb.from('calendar_events').delete().eq('id',eventEditId);
    events=events.filter(function(e){return e.id!==eventEditId;});
    closeEventModal();showToast('削除しました');render();
  }catch(e){showToast('削除失敗');}
}

// ===== MEMO MODAL =====
function openAddMemo(){
  memoModalMode='add';memoEditId=null;memoColor='red';
  document.getElementById('memoModalTitle').textContent='メモを追加';
  document.getElementById('memoContent').value='';
  document.getElementById('memoSaveBtn').textContent='追加';
  buildColorPicker('memoColorPicker','red','selectMemoColor');
  openModal('memoModal');
}

function openEditMemo(id){
  var m=memos.find(function(x){return x.id===id;});
  if(!m) return;
  memoModalMode='edit';memoEditId=id;memoColor=m.color||'red';
  document.getElementById('memoModalTitle').textContent='メモを編集';
  document.getElementById('memoContent').value=m.content||'';
  document.getElementById('memoSaveBtn').textContent='完了';
  buildColorPicker('memoColorPicker',memoColor,'selectMemoColor');
  openModal('memoModal');
}

function closeMemoModal(){closeModal('memoModal');}

async function saveMemo(){
  var content=document.getElementById('memoContent').value.trim();
  if(!content){showToast('テキストを入力してください');return;}
  try{
    if(memoModalMode==='add'){
      var maxO=0;memos.forEach(function(m){if((m.sort_order||0)>maxO)maxO=m.sort_order||0;});
      var r=await sb.from('board_memos').insert({content:content,color:memoColor,is_done:false,sort_order:maxO+1}).select().single();
      if(r.error)throw r.error;
      memos.push(r.data);
    } else {
      var r2=await sb.from('board_memos').update({content:content,color:memoColor}).eq('id',memoEditId);
      if(r2.error)throw r2.error;
      var idx=memos.findIndex(function(m){return m.id===memoEditId;});
      if(idx>=0) Object.assign(memos[idx],{content:content,color:memoColor});
    }
    closeMemoModal();showToast('保存しました');render();
  }catch(e){showToast('保存失敗: '+e.message);}
}

// ===== MEMO ACTIONS =====
function toggleMemoCheck(id){
  checkedMemos[id]=!checkedMemos[id];
  if(!checkedMemos[id]) delete checkedMemos[id];
  render();
}

function clearMemoChecks(){checkedMemos={};render();}

async function doneCheckedMemos(){
  var ids=Object.keys(checkedMemos).filter(function(id){return checkedMemos[id];});
  try{
    for(var i=0;i<ids.length;i++){
      await sb.from('board_memos').update({is_done:true}).eq('id',ids[i]);
      var m=memos.find(function(x){return x.id===ids[i];});
      if(m) m.is_done=true;
    }
    checkedMemos={};showToast('完了に移動しました');render();
  }catch(e){showToast('失敗しました');}
}

async function deleteCheckedMemos(){
  var ids=Object.keys(checkedMemos).filter(function(id){return checkedMemos[id];});
  try{
    for(var i=0;i<ids.length;i++){
      await sb.from('board_memos').delete().eq('id',ids[i]);
    }
    memos=memos.filter(function(m){return !checkedMemos[m.id];});
    checkedMemos={};showToast('削除しました');render();
  }catch(e){showToast('失敗しました');}
}

async function deleteAllDone(){
  var done=memos.filter(function(m){return m.is_done;});
  try{
    for(var i=0;i<done.length;i++) await sb.from('board_memos').delete().eq('id',done[i].id);
    memos=memos.filter(function(m){return !m.is_done;});
    showToast('全削除しました');render();
  }catch(e){showToast('失敗しました');}
}

async function moveMemo(id,dir){
  var active=memos.filter(function(m){return !m.is_done;}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
  var idx=active.findIndex(function(m){return m.id===id;});
  var newIdx=idx+dir;
  if(newIdx<0||newIdx>=active.length) return;
  var a=active[idx],b=active[newIdx];
  var tmp=a.sort_order;a.sort_order=b.sort_order;b.sort_order=tmp;
  try{
    await sb.from('board_memos').update({sort_order:a.sort_order}).eq('id',a.id);
    await sb.from('board_memos').update({sort_order:b.sort_order}).eq('id',b.id);
    render();
  }catch(e){showToast('移動失敗');}
}

function toggleDoneSection(){
  doneSectionOpen=!doneSectionOpen;
  var el=document.getElementById('doneSection');
  if(el) el.classList.toggle('open',doneSectionOpen);
  var chev=el&&el.querySelector('.done-chevron');
  if(chev) chev.style.transform=doneSectionOpen?'rotate(90deg)':'';
}

init();
</script>
</body>
</html>
